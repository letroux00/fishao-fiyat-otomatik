name: Wiki prices

# Every day at 00:05 UTC (03:05 Turkey time, just after the game day turns over), and by hand from the Actions tab.
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

# contents: write lets the job commit data/last.json. That daily commit also keeps the schedule alive:
# GitHub turns off scheduled workflows in public repos after 60 days without repository activity.
permissions:
  contents: write

concurrency:
  group: wiki-prices
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/wiki_prices.py
        env:
          FISHAO_SITE_URL: https://fishao-fiyat.onrender.com
          FISHAO_UPLOAD_KEY: ${{ secrets.FISHAO_UPLOAD_KEY }}
          WIKI_LAST_FILE: data/last.json
      - name: Keep today's prices for tomorrow's comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last.json
          git diff --cached --quiet || git commit -m "chore: prices of $(date -u +%F)"
          git push
